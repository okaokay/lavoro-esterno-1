# =============================================================================
# Reverse proxy - Lavoro Esterno
# -----------------------------------------------------------------------------
# Unico punto di ingresso pubblico dello stack (servizio "nginx" nel
# docker-compose). Instrada:
#   /        -> servizio "frontend" (build statica React servita da nginx
#               interno al container frontend)
#   /api/    -> servizio "api" (FastAPI, porta interna 8000)
# postgres/redis/minio NON sono raggiungibili da qui: restano sulla rete
# interna "lavoro-esterno-net" e non hanno un vhost pubblico.
# =============================================================================

# Resolver DNS interno di Docker: necessario perché i nomi dei servizi
# (frontend, api) sono risolti dinamicamente dalla rete docker-compose.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    # Header di sicurezza base applicati a tutte le risposte.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    client_max_body_size 25m;

    # ---------------------------------------------------------------------
    # API FastAPI. Il prefisso "/api/" viene preservato a monte (il backend
    # espone le rotte sotto "/api/v1/..."), qui non viene fatto alcun
    # rewrite del path.
    # ---------------------------------------------------------------------
    location /api/ {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necessario per eventuali connessioni WebSocket/streaming lato API.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Documentazione OpenAPI generata automaticamente da FastAPI.
    location /docs {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }

    # ---------------------------------------------------------------------
    # Frontend (SPA React/Vite). Tutto il resto del traffico va qui; il
    # container frontend gestisce internamente il fallback su index.html
    # per il routing lato client.
    # ---------------------------------------------------------------------
    location / {
        set $frontend_upstream frontend:8080;
        proxy_pass http://$frontend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

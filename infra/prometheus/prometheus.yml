# =============================================================================
# Prometheus - Lavoro Esterno
# -----------------------------------------------------------------------------
# Scrape delle metriche FastAPI su /metrics e dei target infrastrutturali
# interni: Prometheus, Loki, Celery, PostgreSQL, Redis e volumi applicativi.
# Nessuna porta exporter viene pubblicata dall'host tramite questo file.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # Metriche applicative dell'API (richieste HTTP, latenze, task Celery
  # inoltrati, ecc.). Il nome host "api" corrisponde al servizio
  # docker-compose sulla rete interna "lavoro-esterno-net".
  - job_name: "api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "lavoro-esterno-api"

  # Prometheus monitora anche se stesso.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "celery-exporter"
    static_configs:
      - targets: ["celery-exporter:9808"]

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "volume-exporter"
    static_configs:
      - targets: ["volume-exporter:9100"]

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  - job_name: "alloy"
    static_configs:
      - targets: ["alloy:12345"]

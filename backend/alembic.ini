[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# L'URL reale viene impostato dinamicamente in migrations/env.py leggendo
# app.config.settings (DATABASE_URL), per non duplicare la configurazione tra
# .env e questo file. Il valore qui sotto è solo un fallback/placeholder.
sqlalchemy.url = postgresql+psycopg2://lavoro_esterno:lavoro_esterno@localhost:5432/lavoro_esterno

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

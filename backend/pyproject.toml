[project]
name = "lavoro-esterno-backend"
version = "0.1.0"
description = "Backend per Lavoro Esterno: raccolta e deduplicazione di annunci per numero di telefono, con gestione media e AI."
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.8",
    "celery[redis]>=5.4.0",
    "minio>=7.2.9",
    "pillow>=10.4.0",
    "imagehash>=4.3.1",
    "argon2-cffi>=23.1.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",
    "PyJWT[crypto]>=2.10.1",
    "python-multipart>=0.0.12",
    "httpx[socks]>=0.27.2",
    "lxml>=6.1.1",
    "playwright>=1.62.0",
    "scrapling[fetchers]>=0.4.15",
    "curl-cffi>=0.16.2",
    "cryptography>=43.0.1",
    "email-validator>=2.2.0",
    "openai>=2.0.0",
    "nudenet==3.4.2",
    "prometheus-client>=0.26.0,<0.27.0",
    "prometheus-fastapi-instrumentator>=8.1.0,<9.0.0",
    "phonenumbers>=9.0.0,<10.0.0",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8.0",
    "pip-audit>=2.7.3",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI usa deliberatamente `Depends(...)` come default degli argomenti
# delle route (è l'idioma raccomandato dal framework), quindi disattiviamo
# questo specifico warning per non generare falsi positivi su ogni endpoint.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

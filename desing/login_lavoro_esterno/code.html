<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-secondary-fixed-variant": "#3a485b",
                        "muted": "#f1f5f9",
                        "on-tertiary-fixed": "#360f00",
                        "tertiary-fixed": "#ffdbcd",
                        "primary": "#004ac6",
                        "surface-bright": "#faf8ff",
                        "surface-container-highest": "#dae2fd",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-tint": "#0053db",
                        "primary-container": "#2563eb",

                        "on-error": "#ffffff",
                        "secondary-fixed": "#d5e3fc",
                        "on-background": "#131b2e",

                        "inverse-primary": "#b4c5ff",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",

                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "margin-page": "24px",
                        "sidebar-collapsed": "64px",

<body class="bg-background text-on-background min-h-screen flex items-center justify-center font-body-md antialiased p-margin-page">
<div class="w-full max-w-[420px] bg-surface-container-lowest border border-border rounded-lg shadow-[0_4px_24px_rgba(0,0,0,0.04)] overflow-hidden flex flex-col">
<!-- Header -->
<div class="p-8 pb-6 text-center border-b border-border bg-surface-bright">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight mb-2">Lavoro Esterno</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Enterprise Data</p>
</div>
<!-- Form Content -->
<div class="p-8 pt-6 flex-1 flex flex-col justify-center">
<form action="#" class="space-y-5" method="POST">
<div class="space-y-1.5">
<label class="block font-label-sm text-label-sm text-on-surface" for="email">Email / Username</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="person" style="font-size: 18px;">person</span>
</div>
<input class="block w-full pl-9 pr-3 py-2 border border-outline-variant rounded bg-surface focus:ring-2 focus:ring-primary-container focus:border-primary-container font-mono-data text-mono-data text-on-surface placeholder-outline-variant transition-colors" id="email" name="email" placeholder="user@lavoro.internal" required="" type="text">
</div>
</div>
<div class="space-y-1.5">
<label class="block font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="lock" style="font-size: 18px;">lock</span>
</div>
<input class="block w-full pl-9 pr-3 py-2 border border-outline-variant rounded bg-surface focus:ring-2 focus:ring-primary-container focus:border-primary-container font-mono-data text-mono-data text-on-surface placeholder-outline-variant transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<div class="pt-4">
<button class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded shadow-sm font-label-sm text-label-sm text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="submit">
                        Sign in
                    </button>
</div>
</form>
</div>
<!-- Footer / Metadata -->
<div class="px-8 py-4 bg-surface-container-low border-t border-border flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-warning" data-icon="warning" style="font-size: 16px;">warning</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">Restricted Access / Internal System</p>
</div>
</div>
</body></html>
